    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #496E38; height: 100%; overflow: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { display: flex; align-items: center; justify-content: center; }
    /* The stage keeps the Figma frame's 1728 x 1117 proportions and scales to fit the whole window */
    .stage {
      position: relative;
      width: min(100vw, 100vh * 1728 / 1117);
      container-type: inline-size;
      aspect-ratio: 1728 / 1117;
      overflow: hidden;
      background: #496E38;
    }
    .item {
      position: absolute;
      height: auto;
      aspect-ratio: 16 / 9;
      background-size: contain; background-repeat: no-repeat; background-position: center;
      user-select: none;
      cursor: pointer;
    }
    /* While an icon is hovered, hide every icon that isn't the same kind */
    .stage.hovering .item:not(.match) {
      opacity: 0;
      pointer-events: none;
    }
    .blurb {
      position: absolute;
      left: calc(50 / 1728 * 100%);
      bottom: calc(50 / 1117 * 100%);
      font-family: "Inter", sans-serif;
      font-weight: 400;
      font-size: calc(16 / 1728 * 100cqw);
      line-height: normal;
      color: #fff;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
    }
    .stage.hovering .blurb { opacity: 1; }
    .title {
      position: absolute;
      left: calc(50 / 1728 * 100%);
      top: calc(50 / 1117 * 100%);
      font-family: "Inter", sans-serif;
      font-weight: 400;
      font-size: calc(16 / 1728 * 100cqw);
      line-height: normal;
      color: #fff;
      white-space: nowrap;
    }

  <script>
    // Edit these sentences to change what pops up for each kind of icon.
    const blurbs = {
      tree:        "explore your surroundings. what materials can you find?",
      tent:        "set up your tents. what makes an environment feel inviting? how can we create a safe space?",
      seesaw:      "build your rides. how can we have fun together? ...what do you find fun?",
      funnel_cake: "perfect your funnel cake recipe. just cause.",
      bowl:        "test your recipes. nothing is perfect on the first go. what makes a good carnival snack? what foods do you want to share?",
      sign:        "it’s time to open. remember this is a group effort… do you know what you will do when you run into disputes?"
    };

    const stage = document.querySelector(".stage");
    const blurb = document.querySelector(".blurb");
    const items = document.querySelectorAll(".item");
    const kindOf = el => Object.keys(blurbs).find(k => el.classList.contains(k));

    items.forEach(item => {
      item.addEventListener("mouseenter", () => {
        const kind = kindOf(item);
        items.forEach(i => i.classList.toggle("match", kindOf(i) === kind));
        blurb.textContent = blurbs[kind];
        stage.classList.add("hovering");
      });
      item.addEventListener("mouseleave", () => {
        stage.classList.remove("hovering");
      });
    });
  </script>
